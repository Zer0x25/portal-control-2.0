<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal Control Interno — Sistema de Gestión de Operaciones Industrial"
    />
    <meta name="theme-color" content="#030305" />
    <title>Portal Control Interno</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://ipapi.co" />
  </head>
  <body class="bg-token-surface-app text-token-text-primary antialiased">
    <div
      id="dashboard-bootstrap-shell"
      role="status"
      aria-live="polite"
      aria-label="Cargando Dashboard Operativo"
      hidden
    >
      <div
        class="fixed inset-0 z-[9999] grid place-items-center bg-token-surface-app p-4 text-token-text-primary"
      >
        <section
          class="w-full max-w-3xl rounded-lg bg-token-surface-card p-6 text-center shadow-lg"
        >
          <p class="mb-2 text-xs font-semibold text-token-text-tertiary uppercase">
            Portal Control Interno
          </p>
          <h1 class="text-3xl font-bold sm:text-5xl">Dashboard Operativo</h1>
          <div class="mt-3 rounded-sm bg-token-surface-app p-4">
            <div id="dashboard-bootstrap-date" class="text-xs text-token-text-tertiary"></div>
            <time
              id="dashboard-bootstrap-time"
              class="block font-mono text-2xl font-bold sm:text-4xl"
            ></time>
          </div>
        </section>
      </div>
    </div>
    <div id="root"></div>
    <script id="dashboard-bootstrap-script">
      (() => {
        const shell = document.getElementById("dashboard-bootstrap-shell");
        const root = document.getElementById("root");
        if (!shell || !root) return;

        const currentRoute = () => window.location.hash.split("?")[0];
        try {
          if (!window.sessionStorage.getItem("authToken")) {
            shell.remove();
            return;
          }
        } catch {
          shell.remove();
          return;
        }

        if (currentRoute() !== "#/dashboard") {
          shell.remove();
          return;
        }

        const now = new Date();
        const date = new Intl.DateTimeFormat("es-CL", {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        }).format(now);
        const time = new Intl.DateTimeFormat("es-CL", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(now);
        const dateElement = document.getElementById("dashboard-bootstrap-date");
        const timeElement = document.getElementById("dashboard-bootstrap-time");
        if (dateElement) dateElement.textContent = date;
        if (timeElement) timeElement.textContent = time;
        shell.hidden = false;

        const observer = new MutationObserver(() => {
          if (root.querySelector('[data-testid="server-clock"]')) {
            shell.remove();
            observer.disconnect();
            window.clearTimeout(expiry);
            window.removeEventListener("hashchange", onHashChange);
          }
        });
        observer.observe(root, { childList: true, subtree: true });
        const onHashChange = () => {
          if (currentRoute() !== "#/dashboard") {
            shell.remove();
            observer.disconnect();
            window.clearTimeout(expiry);
            window.removeEventListener("hashchange", onHashChange);
          }
        };
        window.addEventListener("hashchange", onHashChange);
        const expiry = window.setTimeout(() => {
          shell.remove();
          observer.disconnect();
          window.removeEventListener("hashchange", onHashChange);
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
