version: 2
# Node 26 is Current, not LTS (Active LTS lands 2026-10-28). Node's own
# guidance is to run production on Active or Maintenance LTS only, and the
# repository pins 24 across .nvmrc, engines.node, CI and both Dockerfiles.
# Without these ignores Dependabot re-opens the same Node 26 PRs every Monday,
# each one burning a full 7-job CI run before it gets closed again.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    versioning-strategy: increase
    rebase-strategy: auto
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: undici-types
        versions: [">=8"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    versioning-strategy: increase
    rebase-strategy: auto
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: undici-types
        versions: [">=8"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: build
    ignore:
      - dependency-name: node
        versions: [">=25-alpine"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: build
    ignore:
      - dependency-name: node
        versions: [">=25-alpine"]
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: build
