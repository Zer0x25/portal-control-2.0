name: Portal Control CD

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag or version name (e.g. v8.24.1)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag or version to deploy"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Build once, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      BACKEND_IMAGE: portal-backend:${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_IMAGE: portal-frontend:${{ github.run_id }}-${{ github.run_attempt }}
      GATEWAY_IMAGE: portal-gateway:${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.staging.yaml:compose.images.yaml
      COMPOSE_PROJECT_NAME: release-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_ENV_FILES: .env.staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name && inputs.tag_name != 'latest' && inputs.tag_name || github.ref }}
      - name: Resolve source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Build backend once
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=portal-control-2-0-backend
          cache-to: type=gha,mode=max,scope=portal-control-2-0-backend
      - name: Build frontend once
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=portal-control-2-0-frontend
          cache-to: type=gha,mode=max,scope=portal-control-2-0-frontend
      - name: Build gateway once
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          load: true
          tags: ${{ env.GATEWAY_IMAGE }}
          cache-from: type=gha,scope=portal-control-2-0-gateway
          cache-to: type=gha,mode=max,scope=portal-control-2-0-gateway
      - name: Record tested images
        run: node scripts/release-images.cjs record
      - name: Create isolated staging credentials
        run: |
          cp .env.staging.example .env.staging
          printf '\nJWT_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" '999.666' >> .env.staging
      - name: Start exact images
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Install test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Functional and visual release gate
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080/api
          E2E_ADMIN_PASSWORD: "999.666"
        run: npx playwright test --project=functional --project=visual
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images without rebuilding
        env:
          TAG_INPUT: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: node scripts/release-images.cjs publish
      - name: Save test reports and image manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            release-images.json
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Clean isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
  pin-stack-images:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: release-validation
      - name: Pin published digests
        run: node scripts/release-images.cjs pin release-validation/release-images.json
      - name: Commit pinned stack
        run: |
          if git diff --quiet -- compose.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose.yaml
          git commit -m 'chore(deploy): pin validated image digests [skip ci]'
          git push origin HEAD:main
