name: Portal Control CD

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag or version name (e.g. v8.24.1)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag or version to deploy'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  e2e-smoke:
    name: E2E Smoke (staging release validation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Create staging env
        run: |
          cp .env.staging.example .env.staging
          printf '\nJWT_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\n' \
            "${{ secrets.JWT_SECRET || github.run_id }}" \
            "${{ secrets.SEED_ADMIN_PASSWORD || '999.666' }}" \
            >> .env.staging

      - name: Start compose.staging stack
        run: docker compose --env-file .env.staging -f compose.staging.yaml up -d --build

      - name: Install Playwright chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::gateway no alcanzó http://127.0.0.1:8080 en ~3 min"
          docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200
          exit 1

      - name: Run smoke spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080/api
        run: npx playwright test e2e/smoke.spec.ts

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.staging -f compose.staging.yaml down

  publish-images:
    name: Publish images
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: portal-control-2-0-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: portal-control-2-0-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image_name: portal-control-2-0-gateway
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            ${{ (inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name)) && format('type=raw,value={0}', inputs.tag_name || github.ref_name) || '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.image_name == 'portal-control-2-0-frontend' && format('VITE_SENTRY_DSN={0}', secrets.VITE_SENTRY_DSN) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  pin-stack-images:
    name: Pin stack images
    needs: [e2e-smoke, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin compose images to published tag
        env:
          HEAD_SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          SHORT_SHA="${HEAD_SHA::7}"
          TAG="${TAG_INPUT:-sha-${SHORT_SHA}}"
          OWNER_LC="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"

          sed -i \
            -e "s|image: \${BACKEND_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-backend}:.*|image: \${BACKEND_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-backend}:${TAG}|" \
            -e "s|image: \${FRONTEND_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-frontend}:.*|image: \${FRONTEND_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-frontend}:${TAG}|" \
            -e "s|image: \${GATEWAY_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-gateway}:.*|image: \${GATEWAY_IMAGE:-ghcr.io/${OWNER_LC}/portal-control-2-0-gateway}:${TAG}|" \
            compose.yaml

      - name: Commit pinned compose
        env:
          HEAD_SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if git diff --quiet -- compose.yaml; then
            echo "compose.yaml already pinned to target tag"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.yaml
          COMMIT_TAG="${TAG_INPUT:-${HEAD_SHA::7}}"
          git commit -m "chore(deploy): pin portal images to ${COMMIT_TAG} [skip ci]"
          git push origin HEAD:main
