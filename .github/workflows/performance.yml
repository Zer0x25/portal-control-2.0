name: Rendimiento manual
on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Backend GHCR reference with @sha256 digest (from CD manifest)"
        required: true
        type: string
      frontend_image:
        description: "Frontend GHCR reference with @sha256 digest"
        required: true
        type: string
      gateway_image:
        description: "Gateway GHCR reference with @sha256 digest"
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: manual-performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      GATEWAY_IMAGE: ${{ inputs.gateway_image }}
      COMPOSE_FILE: compose.staging.yaml:compose.images.yaml
      COMPOSE_PROJECT_NAME: performance-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_ENV_FILES: .env.staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate immutable references
        run: node scripts/release-images.cjs validate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare isolated staging
        run: |
          cp .env.staging.example .env.staging
          printf '\nJWT_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" '999.666' >> .env.staging
          docker compose pull
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Install audit tools
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --prefer-offline --loglevel=error
          npx playwright install --with-deps chromium
      - name: Audit existing images
        working-directory: frontend
        env:
          E2E_API_URL: http://127.0.0.1:8080/api
          E2E_ADMIN_PASSWORD: "999.666"
        run: node scripts/audit-release-images.cjs
      - name: Save reports and image identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: frontend/.lighthouseci/
          retention-days: 7
          if-no-files-found: warn
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Clean isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
