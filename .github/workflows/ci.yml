name: Portal Control CI

# Reparto de responsabilidades entre PR y main (ADR-0013 / ADR-0014):
#
#   `pull_request`: Validación completa por cambios.
#   `changes` detecta qué áreas tocaron backend/frontend y solo esos jobs
#   pesados corren después de `gates`.
#   `push` a main: SOLO los gates rápidos de gobernanza (~20 s).
#   Evita repetir la batería funcional pesada que el PR ya validó antes del merge.
#   Para pushes directos a main, el hook local .husky/pre-push cubre la validación.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_CONFIG_NATIVE_IGNORE_WARNING: true

jobs:
  changes:
    name: Detect changes
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'backend/docs/swagger.json'
              - '.github/workflows/ci.yml'
            stack:
              - 'compose.db.dev.yaml'
              - 'compose.staging.yaml'
              - 'compose.yaml'
              - 'nginx/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.*'

  gates:
    name: Gates (agentic, spec, docs)
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (no new credentials in tree)
        run: npm run secrets:scan

      - name: Audit Repository Conventions & Guardrails
        run: |
          echo "### 🛡️ Agentic Guardrails Audit" >> $GITHUB_STEP_SUMMARY
          FAILED=0

          # 1. Verificar existencia y presupuesto de AGENTS.md y diarios de memoria
          echo "Verificando archivos de gobernanza agéntica..."
          if [ ! -f "AGENTS.md" ]; then
            echo "- ❌ Falta \`AGENTS.md\` en la raíz del repositorio." >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            AGENTS_LINES=$(wc -l < AGENTS.md)
            AGENTS_BYTES=$(wc -c < AGENTS.md)
            if [ "$AGENTS_LINES" -gt 120 ] || [ "$AGENTS_BYTES" -gt 8192 ]; then
              echo "- ❌ \`AGENTS.md\` supera el presupuesto de gobernanza ($AGENTS_LINES líneas / $AGENTS_BYTES bytes; máx 120 líneas / 8 KB)." >> $GITHUB_STEP_SUMMARY
              FAILED=1
            else
              echo "- ✅ \`AGENTS.md\` presente y dentro de presupuesto ($AGENTS_LINES líneas / $AGENTS_BYTES bytes)." >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ ! -f ".jules/sentinel.md" ] || [ ! -f ".jules/bolt.md" ]; then
            echo "- ⚠️ Uno o más diarios de memoria (.jules/bolt.md, .jules/sentinel.md) no encontrados." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Diarios de memoria institucional (.jules/) presentes." >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Guardrail de Seguridad: Prohibir child_process.exec con string interpolation
          echo "Auditoria de comandos del sistema (Sentinel)..."
          UNSAFE_EXEC=$(git grep -n -E "child_process.*exec\(|execAsync\(\`" backend/src/ || true)
          if [ -n "$UNSAFE_EXEC" ]; then
            echo "- ❌ Detectado uso potencialmente inseguro de \`exec\` con plantillas de texto:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_EXEC" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron ejecuciones de shell con interpolación de cadenas." >> $GITHUB_STEP_SUMMARY
          fi

          # 3. Guardrail de Seguridad: Prohibir SQL Injection vía $executeRawUnsafe con templates
          echo "Auditoría de consultas SQL crudas (Sentinel)..."
          UNSAFE_SQL=$(git grep -n "\$executeRawUnsafe(\`" backend/src/ || true)
          if [ -n "$UNSAFE_SQL" ]; then
            echo "- ❌ Detectada consulta con \`\$executeRawUnsafe\` interpolando cadenas (usar \$executeRaw parametrizado):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_SQL" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron consultas SQL concatenadas inseguras." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Guardrails agénticos fallaron. Consulta el resumen de la ejecución para más detalles."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Validate PR Title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          HAS_EMOJI=$(node -e 'console.log(/\p{Extended_Pictographic}/u.test(process.env.PR_TITLE ?? "") ? "yes" : "no")')
          if [ "$HAS_EMOJI" = "yes" ]; then
            echo "::error::Título de PR con emoji: \"$PR_TITLE\""
            echo "Acción requerida: reedita el título a formato Conventional puro"
            echo "  tipo(scope opcional): mensaje — sin emojis ni prefijos."
            echo "  Ejemplo: fix(auth): harden login rate limit"
            exit 1
          fi
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+'
          if [[ "$PR_TITLE" =~ ^Merge ]]; then
            exit 0
          fi
          if ! [[ "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::Título de PR inválido: \"$PR_TITLE\""
            echo "Formato requerido por release-please: tipo(scope opcional): mensaje"
            echo "Tipos válidos: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert (sin emojis)"
            exit 1
          fi
          echo "✅ Título de PR cumple Conventional Commits: \"$PR_TITLE\""

      - name: Check specs carry acceptance criteria
        run: npm run spec:check

      - name: Check markdown links and ADR index
        run: npm run docs:check

      # `npx --yes` descarga prettier en cada corrida (~15 s). El cache de npm
      # conserva el tarball entre corridas; el job no instala dependencias.
      - name: Cache prettier download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: prettier-${{ runner.os }}-3.9.9
          restore-keys: |
            prettier-${{ runner.os }}-

      - name: Check Prettier formatting (docs/adr, specs, .agents, AGENTS.md)
        run: npx --yes prettier@3.9.9 --check "docs/adr/*.md" "specs/**/*.md" ".agents/**/*.md" "AGENTS.md"

  verify-backend:
    name: Verify backend
    needs: [gates, changes]
    # Corre exclusivamente en PR si su área cambió (excluyendo bots de release o dependabot).
    # En push a main se salta por diseño (ADR-0013): el PR ya validó la batería pesada.
    # `!cancelled()` evita que un `needs` en skipped cancele la evaluación del resto de la condición.
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.backend == 'true' &&
        github.event_name == 'pull_request' &&
        !startsWith(github.head.ref, 'release-please--') &&
        !startsWith(github.head.ref, 'dependabot/')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pre-descargar la imagen PostgreSQL desechable en segundo plano mientras
      # corren setup-node, npm ci y validate:ci (~1.5 min), ahorrando ~6-8 s al inicio de integración.
      - name: Pre-pull PostgreSQL image in background
        run: docker pull postgres:18.4-alpine &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Prisma Schema & Engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      - name: Generate Prisma client
        # Prisma 7 evalua prisma.config.ts (exige DIRECT_URL) en todo comando
        # del CLI. El codegen no abre conexiones: dummy a proposito.
        env:
          DIRECT_URL: postgresql://prisma-codegen:prisma-codegen@localhost:1/prisma-codegen
        run: npx prisma generate

      # validate:ci:coverage == validate:ci pero con `test:coverage` en vez de
      # `test:schemas-refactor`: la suite completa corre UNA sola vez con thresholds
      # (ratchet). Evita doble ejecución de tests de schemas y consolida la validación CI.
      - name: Run backend CI validation with coverage
        id: validate
        env:
          JWT_SECRET: test-secret
        run: npm run validate:ci:coverage

      - name: HTTP API integration on disposable PostgreSQL
        id: fastify_integration
        run: npm run test:api:integration

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### ⚙️ Backend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ] && [ "${{ steps.fastify_integration.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** Formato Prettier, ESLint, TypeScript Check, SDK Sync, Snapshot Schemas, cobertura, Build e integración Fastify/PostgreSQL pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run backend CI validation'. Si eres un agente AI, consulta \`AGENTS.md\` para ejecutar \`npm run check\` y \`npm run lint\` localmente." >> $GITHUB_STEP_SUMMARY
          fi

  verify-frontend:
    name: Verify frontend
    needs: [gates, changes]
    # Corre exclusivamente en PR si su área cambió (excluyendo bots de release o dependabot).
    # En push a main se salta por diseño (ADR-0013): el PR ya validó la batería pesada.
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.frontend == 'true' &&
        github.event_name == 'pull_request' &&
        !startsWith(github.head.ref, 'release-please--') &&
        !startsWith(github.head.ref, 'dependabot/')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      # validate:ci:coverage == validate:ci pero con `test:coverage` en vez de
      # `test:run:ci`: la suite completa corre UNA vez con thresholds
      # (ratchet). El antiguo job `coverage-ratchet` la corria una segunda
      # vez en otro runner con otro `npm ci`.
      - name: Run frontend CI validation with coverage
        id: validate
        run: npm run validate:ci:coverage

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### 🎨 Frontend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** ESLint, Prettier Check, Type Check, cobertura y Build pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run frontend CI validation'. Si eres un agente AI, ejecuta \`npm run check\` y \`npm run format:check\` en \`frontend/\`." >> $GITHUB_STEP_SUMMARY
          fi
