name: Portal Control CI

# Reparto de responsabilidades entre PR y main (ver ADR-0013):
#
#   `pull_request` -> VALIDACION POR CAMBIOS. `changes` detecta que areas
#     tocaron backend/frontend/stack y solo esos jobs pesados corren, siempre
#     despues de `gates`. Corre sobre el *merge ref*.
#   `push` a main  -> SOLO GATES (~0.5 runner-min). La bateria pesada ya corrio
#     en el PR sobre el mismo codigo (ADR-0013); el hook `pre-push` cubre los
#     pushes directos en la maquina del autor.
#
# Etapas (ver ADR-0014):
#   ETAPA 0 `changes` -> paths-filter, sin npm ci (~15 s). Solo en PR.
#   ETAPA 1 `gates`   -> secret scan + guardrails + spec + docs en UN job
#     (~30 s, un checkout). Antes eran 3 jobs con 3 checkouts y 3 colas.
#   ETAPA 2 `verify-*`-> backend/frontend en paralelo, SOLO si su area cambio
#     y el PR no es de release-please ni dependabot. La cobertura con thresholds (ratchet)
#     corre DENTRO de cada verify: backend anade `test:coverage` (su
#     validate:ci solo corre el subset de schemas) y frontend usa
#     `validate:ci:coverage` (suite completa con --coverage). El antiguo job
#     `coverage-ratchet` duplicaba los `npm ci` y re-corria la suite de
#     frontend una segunda vez (~193 s medidos en ADR-0013).
#   ETAPA 3 `e2e-smoke` -> SOLO si backend/frontend/stack cambio, el PR no es
#     de release-please ni dependabot, y los verifys terminaron en success o skipped. En un
#     PR rojo el e2e ya no quema ~176 s sobre codigo que no pasa validacion.
#
# Ahorro estimado por PR verde completo: ~35% (651 s -> ~400 s). PRs de
# release-please, dependabot o solo-docs pasan de ~11 min a ~40 s
# (changes + gates).
#
# Nota: sin branch protection (plan gratis, ver ADR-0013), los jobs en
# `skipped` no bloquean el merge.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancelar siempre es correcto: el codigo mas nuevo invalida al anterior.
  # En `main` el ref es identico para todos los merges, asi que un merge
  # rapido cancela la corrida del previo. Main solo ejecuta gates
  # (~0.5 runner-min), de modo que cancelar es casi gratis.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'backend/docs/swagger.json'
              - '.github/workflows/ci.yml'
            stack:
              - 'compose.db.dev.yaml'
              - 'compose.staging.yaml'
              - 'compose.yaml'
              - 'nginx/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.*'

  gates:
    name: Gates (agentic, spec, docs)
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (no new credentials in tree)
        run: npm run secrets:scan

      - name: Audit Repository Conventions & Guardrails
        run: |
          echo "### 🛡️ Agentic Guardrails Audit" >> $GITHUB_STEP_SUMMARY
          FAILED=0

          # 1. Verificar existencia de AGENTS.md y diarios de memoria
          echo "Verificando archivos de gobernanza agéntica..."
          if [ ! -f "AGENTS.md" ]; then
            echo "- ❌ Falta \`AGENTS.md\` en la raíz del repositorio." >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ \`AGENTS.md\` presente." >> $GITHUB_STEP_SUMMARY
          fi

          if [ ! -f ".jules/sentinel.md" ] || [ ! -f ".jules/bolt.md" ]; then
            echo "- ⚠️ Uno o más diarios de memoria (.jules/bolt.md, .jules/sentinel.md) no encontrados." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Diarios de memoria institucional (.jules/) presentes." >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Guardrail de Seguridad: Prohibir child_process.exec con string interpolation
          echo "Auditoria de comandos del sistema (Sentinel)..."
          UNSAFE_EXEC=$(git grep -n -E "child_process.*exec\(|execAsync\(\`" backend/src/ || true)
          if [ -n "$UNSAFE_EXEC" ]; then
            echo "- ❌ Detectado uso potencialmente inseguro de \`exec\` con plantillas de texto:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_EXEC" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron ejecuciones de shell con interpolación de cadenas." >> $GITHUB_STEP_SUMMARY
          fi

          # 3. Guardrail de Seguridad: Prohibir SQL Injection vía $executeRawUnsafe con templates
          echo "Auditoría de consultas SQL crudas (Sentinel)..."
          UNSAFE_SQL=$(git grep -n "\$executeRawUnsafe(\`" backend/src/ || true)
          if [ -n "$UNSAFE_SQL" ]; then
            echo "- ❌ Detectada consulta con \`\$executeRawUnsafe\` interpolando cadenas (usar \$executeRaw parametrizado):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_SQL" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron consultas SQL concatenadas inseguras." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Guardrails agénticos fallaron. Consulta el resumen de la ejecución para más detalles."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Check specs carry acceptance criteria
        run: npm run spec:check

      - name: Check markdown links and ADR index
        run: npm run docs:check

      # `npx --yes` descarga prettier en cada corrida (~15 s). El cache de npm
      # conserva el tarball entre corridas; el job no instala dependencias.
      - name: Cache prettier download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: prettier-${{ runner.os }}-3.9.9
          restore-keys: |
            prettier-${{ runner.os }}-

      - name: Check Prettier formatting (docs/adr + specs)
        run: npx --yes prettier@3.9.9 --check "docs/adr/*.md" "specs/**/*.md"

  verify-backend:
    name: Verify backend
    needs: [gates, changes]
    # Solo en PR con cambios en el area y fuera de PRs de release-please
    # (solo bumpean versiones/changelogs). `!cancelled()` evita que un
    # `needs` en skipped cancele la evaluacion del resto de la condicion.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/') && needs.gates.result == 'success' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Prisma Schema & Engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      # `npm run check:sdk` (part of validate:ci) regenerates the frontend SDK
      # with openapi-typescript, so the frontend toolchain must be available.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Generate Prisma client
        # Prisma 7 evalua prisma.config.ts (exige DIRECT_URL) en todo comando
        # del CLI. El codegen no abre conexiones: dummy a proposito.
        env:
          DIRECT_URL: postgresql://prisma-codegen:prisma-codegen@localhost:1/prisma-codegen
        run: npx prisma generate

      - name: Run backend CI validation
        id: validate
        run: npm run validate:ci

      # La cobertura con thresholds (ratchet) corre aqui dentro en vez de en
      # un job separado: evita un checkout + doble `npm ci` + espera en cola
      # extra por PR. validate:ci solo corre el subset de schemas, asi que no
      # hay doble ejecucion de la suite completa.
      - name: Backend coverage (thresholds en vitest.config.ts)
        env:
          JWT_SECRET: test-secret
        run: npm run test:coverage

      - name: Fastify integration on disposable PostgreSQL
        id: fastify_integration
        run: npm run test:fastify:integration

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### ⚙️ Backend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ] && [ "${{ steps.fastify_integration.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** Formato Prettier, ESLint, TypeScript Check, SDK Sync, Snapshot Schemas, cobertura, Build e integración Fastify/PostgreSQL pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run backend CI validation'. Si eres un agente AI, consulta \`AGENTS.md\` para ejecutar \`npm run check\` y \`npm run lint\` localmente." >> $GITHUB_STEP_SUMMARY
          fi

  verify-frontend:
    name: Verify frontend
    needs: [gates, changes]
    # Solo en PR con cambios en el area y fuera de PRs de release-please.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/') && needs.gates.result == 'success' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # validate:ci:coverage == validate:ci pero con `test:coverage` en vez de
      # `test:run:ci`: la suite completa corre UNA vez con thresholds
      # (ratchet). El antiguo job `coverage-ratchet` la corria una segunda
      # vez en otro runner con otro `npm ci`.
      - name: Run frontend CI validation with coverage
        id: validate
        run: npm run validate:ci:coverage

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### 🎨 Frontend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** ESLint, Prettier Check, Type Check, cobertura y Build pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run frontend CI validation'. Si eres un agente AI, ejecuta \`npm run check\` y \`npm run format:check\` en \`frontend/\`." >> $GITHUB_STEP_SUMMARY
          fi

  e2e-smoke:
    name: E2E Smoke (compose.staging)
    needs: [gates, changes, verify-backend, verify-frontend]
    # Solo si toco backend/frontend/stack y los verifys no fallaron (success
    # o skipped cuando su area no cambio). En un PR rojo el e2e ya no quema
    # ~176 s sobre codigo que no pasa validacion.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/') && needs.gates.result == 'success' && (needs.verify-backend.result == 'success' || needs.verify-backend.result == 'skipped') && (needs.verify-frontend.result == 'success' || needs.verify-frontend.result == 'skipped') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Create staging env
        run: |
          cp .env.staging.example .env.staging
          printf '\nJWT_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\n' \
            "${{ secrets.JWT_SECRET || github.run_id }}" \
            "${{ secrets.SEED_ADMIN_PASSWORD || '999.666' }}" \
            >> .env.staging

      - name: Start compose.staging stack
        run: docker compose --env-file .env.staging -f compose.staging.yaml up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 48); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::gateway no alcanzó http://127.0.0.1:8080 en ~4 min"
          docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200
          exit 1

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080/api
        run: npx playwright test e2e/smoke.spec.ts

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.staging -f compose.staging.yaml down
