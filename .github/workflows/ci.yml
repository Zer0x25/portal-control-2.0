name: Portal Control CI

# Reparto de responsabilidades entre PR y main:
#
#   Tanto `pull_request` como `push` a main -> VALIDACIÓN POR CAMBIOS.
#   `changes` detecta qué áreas tocaron backend/frontend/stack y solo esos jobs
#   pesados corren después de `gates`. Si solo cambió documentación o configuración,
#   la ejecución termina en ~30 s (solo gates).
#   En push a main, esto blinda los despliegues directos sin correr jobs innecesarios,
#   y garantiza que Portal Control CD solo despliegue código verificado.
#
# Etapas:
#   ETAPA 0 `changes` -> paths-filter (~10 s). Corre en PR y push a main.
#   ETAPA 1 `gates`   -> secret scan + guardrails + spec + docs (~25 s).
#   ETAPA 2 `verify-*`-> backend/frontend en paralelo, SOLO si su área cambió
#     (y fuera de bots como release-please o dependabot).
#   ETAPA 3 `e2e-smoke` -> SOLO si backend/frontend/stack cambió y los verifys
#     pasaron o fueron skipped.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_CONFIG_NATIVE_IGNORE_WARNING: true

jobs:
  changes:
    name: Detect changes
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'backend/docs/swagger.json'
              - '.github/workflows/ci.yml'
            stack:
              - 'compose.db.dev.yaml'
              - 'compose.staging.yaml'
              - 'compose.yaml'
              - 'nginx/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.*'

  gates:
    name: Gates (agentic, spec, docs)
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (no new credentials in tree)
        run: npm run secrets:scan

      - name: Audit Repository Conventions & Guardrails
        run: |
          echo "### 🛡️ Agentic Guardrails Audit" >> $GITHUB_STEP_SUMMARY
          FAILED=0

          # 1. Verificar existencia de AGENTS.md y diarios de memoria
          echo "Verificando archivos de gobernanza agéntica..."
          if [ ! -f "AGENTS.md" ]; then
            echo "- ❌ Falta \`AGENTS.md\` en la raíz del repositorio." >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ \`AGENTS.md\` presente." >> $GITHUB_STEP_SUMMARY
          fi

          if [ ! -f ".jules/sentinel.md" ] || [ ! -f ".jules/bolt.md" ]; then
            echo "- ⚠️ Uno o más diarios de memoria (.jules/bolt.md, .jules/sentinel.md) no encontrados." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Diarios de memoria institucional (.jules/) presentes." >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Guardrail de Seguridad: Prohibir child_process.exec con string interpolation
          echo "Auditoria de comandos del sistema (Sentinel)..."
          UNSAFE_EXEC=$(git grep -n -E "child_process.*exec\(|execAsync\(\`" backend/src/ || true)
          if [ -n "$UNSAFE_EXEC" ]; then
            echo "- ❌ Detectado uso potencialmente inseguro de \`exec\` con plantillas de texto:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_EXEC" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron ejecuciones de shell con interpolación de cadenas." >> $GITHUB_STEP_SUMMARY
          fi

          # 3. Guardrail de Seguridad: Prohibir SQL Injection vía $executeRawUnsafe con templates
          echo "Auditoría de consultas SQL crudas (Sentinel)..."
          UNSAFE_SQL=$(git grep -n "\$executeRawUnsafe(\`" backend/src/ || true)
          if [ -n "$UNSAFE_SQL" ]; then
            echo "- ❌ Detectada consulta con \`\$executeRawUnsafe\` interpolando cadenas (usar \$executeRaw parametrizado):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$UNSAFE_SQL" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "- ✅ No se detectaron consultas SQL concatenadas inseguras." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Guardrails agénticos fallaron. Consulta el resumen de la ejecución para más detalles."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Check specs carry acceptance criteria
        run: npm run spec:check

      - name: Check markdown links and ADR index
        run: npm run docs:check

      # `npx --yes` descarga prettier en cada corrida (~15 s). El cache de npm
      # conserva el tarball entre corridas; el job no instala dependencias.
      - name: Cache prettier download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: prettier-${{ runner.os }}-3.9.9
          restore-keys: |
            prettier-${{ runner.os }}-

      - name: Check Prettier formatting (docs/adr + specs)
        run: npx --yes prettier@3.9.9 --check "docs/adr/*.md" "specs/**/*.md"

  verify-backend:
    name: Verify backend
    needs: [gates, changes]
    # Corre en PR o en push a main si su área cambió (excluyendo bots de release o dependabot).
    # `!cancelled()` evita que un `needs` en skipped cancele la evaluación del resto de la condición.
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.backend == 'true' && (
        (github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pre-descargar la imagen PostgreSQL desechable en segundo plano mientras
      # corren setup-node, npm ci y validate:ci (~1.5 min), ahorrando ~6-8 s al inicio de integración.
      - name: Pre-pull PostgreSQL image in background
        run: docker pull postgres:18.4-alpine &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Prisma Schema & Engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      - name: Generate Prisma client
        # Prisma 7 evalua prisma.config.ts (exige DIRECT_URL) en todo comando
        # del CLI. El codegen no abre conexiones: dummy a proposito.
        env:
          DIRECT_URL: postgresql://prisma-codegen:prisma-codegen@localhost:1/prisma-codegen
        run: npx prisma generate

      # validate:ci:coverage == validate:ci pero con `test:coverage` en vez de
      # `test:schemas-refactor`: la suite completa corre UNA sola vez con thresholds
      # (ratchet). Evita doble ejecución de tests de schemas y consolida la validación CI.
      - name: Run backend CI validation with coverage
        id: validate
        env:
          JWT_SECRET: test-secret
        run: npm run validate:ci:coverage

      - name: HTTP API integration on disposable PostgreSQL
        id: fastify_integration
        run: npm run test:api:integration

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### ⚙️ Backend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ] && [ "${{ steps.fastify_integration.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** Formato Prettier, ESLint, TypeScript Check, SDK Sync, Snapshot Schemas, cobertura, Build e integración Fastify/PostgreSQL pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run backend CI validation'. Si eres un agente AI, consulta \`AGENTS.md\` para ejecutar \`npm run check\` y \`npm run lint\` localmente." >> $GITHUB_STEP_SUMMARY
          fi

  verify-frontend:
    name: Verify frontend
    needs: [gates, changes]
    # Corre en PR o en push a main si su área cambió (excluyendo bots de release o dependabot).
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.frontend == 'true' && (
        (github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      # validate:ci:coverage == validate:ci pero con `test:coverage` en vez de
      # `test:run:ci`: la suite completa corre UNA vez con thresholds
      # (ratchet). El antiguo job `coverage-ratchet` la corria una segunda
      # vez en otro runner con otro `npm ci`.
      - name: Run frontend CI validation with coverage
        id: validate
        run: npm run validate:ci:coverage

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### 🎨 Frontend CI Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "- **Estado:** ✅ APROBADO" >> $GITHUB_STEP_SUMMARY
            echo "- **Validaciones:** ESLint, Prettier Check, Type Check, cobertura y Build pasaron exitosamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ❌ FALLIDO" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnóstico:** Revisa el paso 'Run frontend CI validation'. Si eres un agente AI, ejecuta \`npm run check\` y \`npm run format:check\` en \`frontend/\`." >> $GITHUB_STEP_SUMMARY
          fi

  e2e-smoke:
    name: E2E Smoke (compose.staging)
    needs: [gates, changes, verify-backend, verify-frontend]
    # Solo si tocó backend/frontend/stack y los verifys no fallaron (success o skipped).
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' && (needs.verify-backend.result == 'success' || needs.verify-backend.result == 'skipped') && (needs.verify-frontend.result == 'success' || needs.verify-frontend.result == 'skipped') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.stack == 'true') && (
        (github.event_name == 'pull_request' && !startsWith(github.head.ref, 'release-please--') && !startsWith(github.head.ref, 'dependabot/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Create staging env
        run: |
          cp .env.staging.example .env.staging
          printf '\nJWT_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\n' \
            "${{ secrets.JWT_SECRET || github.run_id }}" \
            "${{ secrets.SEED_ADMIN_PASSWORD || '999.666' }}" \
            >> .env.staging

      - name: Start compose.staging stack
        run: docker compose --env-file .env.staging -f compose.staging.yaml up -d --build

      # Instalar / verificar Playwright mientras la pila de compose se levanta en segundo plano.
      # Si el cache de navegador hizo hit, se evita el apt-get update innecesario de --with-deps.
      - name: Install Playwright chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::gateway no alcanzó http://127.0.0.1:8080 en ~3 min"
          docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200
          exit 1

      - name: Run smoke spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080/api
        run: npx playwright test e2e/smoke.spec.ts

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --env-file .env.staging -f compose.staging.yaml logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.staging -f compose.staging.yaml down
