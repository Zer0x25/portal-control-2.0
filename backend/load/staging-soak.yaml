# Soak 15 min solo-lecturas con token admin reutilizado (sin logins en el
# escenario: el rate-limit de login tumbaría la rampa). 3 lecturas/VU a
# 1 VU/s ≈ 2700 reqs: bajo el presupuesto del gateway (5000/15min por IP;
# con 6 lecturas el throttle 429 ensuciaba el reporte).
config:
  target: "{{ $env.LOAD_TARGET }}"
  variables:
    adminToken: "{{ $env.LOAD_ADMIN_TOKEN }}"
    today: "{{ $env.LOAD_TODAY }}"
  phases:
    - duration: 900
      arrivalRate: 1
      name: "soak sostenido"
  ensure:
    maxErrorRate: 1

scenarios:
  - name: "sync dashboard admin"
    weight: 100
    flow:
      - get:
          url: "/api/kpis/overview"
          headers:
            Authorization: "Bearer {{ adminToken }}"
          expect:
            - statusCode: 200
      - get:
          url: "/api/employees"
          headers:
            Authorization: "Bearer {{ adminToken }}"
          expect:
            - statusCode: 200
      - get:
          url: "/api/records?employeeId={{ $env.LOAD_EMPLOYEE_ID }}&desde={{ today }}&hasta={{ today }}"
          headers:
            Authorization: "Bearer {{ adminToken }}"
          expect:
            - statusCode: 200
